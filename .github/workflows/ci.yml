name: CI

# Runs on every push and on every PR into main.
# Make these three jobs required checks on main (Settings -> Branches).
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-safety:
    name: repo-safety (no secrets or junk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block forbidden tracked files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.db$|(^|/)node_modules/|(^|/)__pycache__/|(^|/)\.venv/|(^|/)\.coverage($|\.)' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be committed:"; echo "$bad"; exit 1
          fi
      - name: Block API keys in tracked files
        run: |
          hits=$(git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{30,}|sk_[a-f0-9]{40,}' -- . ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible API key committed. Remove it AND rotate the key:"; echo "$hits" | cut -c1-80; exit 1
          fi

  backend:
    name: backend (tests + branch coverage >= 75%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests with branch coverage (threshold in backend/.coveragerc)
        run: python -m pytest -q --cov --cov-report=term-missing

  frontend:
    name: frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
